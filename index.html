<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Gapless Amp</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Amp">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css?v=1">
</head>
<body>
<main id="stage"></main>

<nav id="bar">
  <button id="open-library" type="button">Library</button>
  <span id="now"></span>
</nav>

<section id="library" hidden>
  <header>
    <h1>Media Library</h1>
    <button id="close-library" type="button" aria-label="Close">×</button>
  </header>
  <div class="actions">
    <button id="add" type="button">Add MP3s</button>
    <button id="skin" type="button">Load skin</button>
    <button id="edit" type="button">Edit</button>
  </div>
  <p id="status" role="status"></p>
  <ul id="albums"></ul>
  <footer>
    <span id="usage"></span>
    <button id="skin-reset" type="button">Default skin</button>
    <button id="out-mode" type="button"></button>
  </footer>
</section>

<input id="pick-mp3" type="file" accept="audio/mpeg,.mp3" multiple hidden>
<!-- No accept filter: iOS greys out extensions it has no type for, and .wsz is one. -->
<input id="pick-skin" type="file" hidden>

<script type="module" src="app.js?v=1"></script>
</body>
</html>
