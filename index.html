<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Gapless Amp</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Amp">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css?v=5">
</head>
<body>
<main id="stage"></main>

<!-- Keeps the player clear of the home indicator. -->
<div id="bar"></div>

<!-- Moved into Webamp's root at startup and framed as one of its generic
     windows, so the skin in use draws it (see "skin windows" in app.js). -->
<section id="dialog" hidden>
  <div class="box">
    <div id="dialog-body"></div>
  </div>
</section>

<input id="pick-mp3" type="file" accept="audio/mpeg,.mp3" multiple hidden>
<!-- No accept filter: iOS greys out extensions it has no type for, and .wsz is one. -->
<input id="pick-skin" type="file" hidden>

<script type="module" src="app.js?v=7"></script>
<!-- Hidden feedback trigger, on Daniel's devices only: see ~/kichi-feedback. -->
<script src="https://kichi.tailae45a.ts.net:8447/feedback.js" data-app="gapless-amp" async></script>
</body>
</html>
